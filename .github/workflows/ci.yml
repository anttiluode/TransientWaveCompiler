name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: twc examples/three_node.json -o /tmp/three_node.tw1.json
      - run: twc examples/continuous_three_node.json -o /tmp/continuous_three_node.tw1.json
      - run: twc-tw1a examples/continuous_three_node.json -o /tmp/continuous_three_node.tw1a.json
