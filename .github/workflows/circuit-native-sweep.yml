name: circuit-native-sweep

on:
  push:
    branches:
      - agent/tw1a-circuit-architecture-v01
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run preregistered circuit-native sweeps
        run: python experiments/circuit_native_sweep_v01.py
      - name: Upload sweep result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-native-sweep-v01
          path: circuit-native-sweep-v01.json
          if-no-files-found: warn
