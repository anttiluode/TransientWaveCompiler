name: circuit-v03-key-sweep

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run preregistered v0.3 primitive sweeps
        run: python experiments/circuit_v03_key_sweep.py
      - name: Upload v0.3 sweep result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-v03-key-sweep
          path: circuit-v03-key-sweep.json
          if-no-files-found: warn
