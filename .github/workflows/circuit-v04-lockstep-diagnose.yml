name: circuit-v04-lockstep-diagnose

on:
  push:
    branches:
      - agent/tw1a-calibration-first-v04
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Split v0.4 lockstep error group
        run: python experiments/circuit_v04_lockstep_diagnose.py
      - name: Upload lockstep diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-v04-lockstep-diagnose
          path: circuit-v04-lockstep-diagnose.json
          if-no-files-found: warn
