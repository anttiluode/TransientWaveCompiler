name: circuit-v05-corner

on:
  push:
    branches:
      - agent/tw1a-phase-symmetric-v05
  workflow_dispatch:

jobs:
  corner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run preregistered phase-symmetric v0.5 corner
        run: python experiments/circuit_v05_corner.py
      - name: Upload v0.5 corner result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-v05-corner
          path: circuit-v05-corner.json
          if-no-files-found: warn
