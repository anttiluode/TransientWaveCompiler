name: circuit-v08-self-thermal

on:
  push:
    branches:
      - agent/tw1a-common-diff-v08
    paths:
      - 'transientwave/circuit_emulator_v08_self_thermal.py'
      - 'experiments/circuit_v08_self_thermal_corner.py'
      - 'docs/CIRCUIT_V08_SELF_THERMAL_PREREG.md'
      - '.github/workflows/circuit-v08-self-thermal.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run preregistered fresh v0.8 self-thermal gate
        run: python experiments/circuit_v08_self_thermal_corner.py
      - name: Upload formal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-v08-self-thermal
          path: circuit-v08-self-thermal-corner.json
