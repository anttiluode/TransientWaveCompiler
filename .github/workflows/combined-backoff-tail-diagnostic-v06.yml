name: combined-backoff-tail-diagnostic-v06

on:
  push:
    paths:
      - "transientwave/combined_backoff_tail_diagnostic_v06.py"
      - ".github/workflows/combined-backoff-tail-diagnostic-v06.yml"
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m transientwave.combined_backoff_tail_diagnostic_v06
      - uses: actions/upload-artifact@v4
        with:
          name: combined-backoff-tail-diagnostic-v06
          path: runs/combined_backoff_tail_diagnostic_v06.json
