name: filter-cli-ci

on:
  push:
    branches:
      - agent/tw1a-common-diff-v08
    paths:
      - 'pyproject.toml'
      - 'transientwave/coupled_resonator_filter.py'
      - 'transientwave/generalized_coupling_matrix.py'
      - 'transientwave/measurement_aware_filter.py'
      - 'transientwave/filter_tuning.py'
      - 'transientwave/filter_units.py'
      - 'transientwave/filter_analysis.py'
      - 'transientwave/filter_cli.py'
      - 'transientwave/touchstone.py'
      - 'transientwave/topology_discovery.py'
      - 'tests/test_filter_tuning.py'
      - 'tests/test_filter_units.py'
      - 'tests/test_filter_analysis.py'
      - 'tests/test_measurement_aware_filter.py'
      - 'tests/test_touchstone.py'
      - 'tests/test_topology_discovery.py'
      - '.github/workflows/filter-cli-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run filter tool tests
        run: >-
          python -m unittest
          tests.test_filter_tuning
          tests.test_filter_units
          tests.test_filter_analysis
          tests.test_measurement_aware_filter
          tests.test_touchstone
          tests.test_topology_discovery
          tests.test_generalized_coupling_matrix
          tests.test_coupled_resonator_filter
          -v
      - name: Check console entry point
        run: twc-filter --help
