name: hardware-envelope-order-v07

on:
  push:
    paths:
      - "transientwave/hardware_envelope_order_v07.py"
      - "transientwave/emulator_v05.py"
      - "docs/HARDWARE_ENVELOPE_ORDER_PREREG_V07.md"
      - ".github/workflows/hardware-envelope-order-v07.yml"
  workflow_dispatch:

jobs:
  confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m transientwave.hardware_envelope_order_v07
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-envelope-order-v07
          path: runs/hardware_envelope_order_v07.json
