name: hardware-envelope-v02

on:
  push:
    paths:
      - 'transientwave/envelope_v02.py'
      - '.github/workflows/hardware-envelope-v02.yml'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run frozen corrected hardware envelope
        run: python -m transientwave.envelope_v02
      - uses: actions/upload-artifact@v4
        with:
          name: tw1a-hardware-envelope-v02
          path: runs/hardware_envelope_v02.json
