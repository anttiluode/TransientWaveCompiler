name: joint-precision-diagnostic-v03

on:
  push:
    paths:
      - "transientwave/joint_precision_diagnostic_v03.py"
      - ".github/workflows/joint-precision-diagnostic-v03.yml"
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m transientwave.joint_precision_diagnostic_v03
      - uses: actions/upload-artifact@v4
        with:
          name: joint-precision-diagnostic-v03
          path: runs/joint_precision_diagnostic_v03.json
