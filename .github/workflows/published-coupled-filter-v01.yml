name: published-coupled-filter-v01

on:
  push:
    branches:
      - agent/tw1a-common-diff-v08
    paths:
      - 'transientwave/coupled_resonator_filter.py'
      - 'tests/test_coupled_resonator_filter.py'
      - 'experiments/published_coupled_filter_v01.py'
      - 'docs/BENCHMARK_PUBLISHED_COUPLED_FILTER_V01_PREREG.md'
      - '.github/workflows/published-coupled-filter-v01.yml'
  workflow_dispatch:

jobs:
  tune:
    strategy:
      fail-fast: false
      matrix:
        start: [A, B, C, D, E]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Check analytic coupling-matrix gradient
        run: python -m unittest tests.test_coupled_resonator_filter -v
      - name: Tune published detuned matrix
        run: python experiments/published_coupled_filter_v01.py --start ${{ matrix.start }}
      - name: Upload tuning result
        uses: actions/upload-artifact@v4
        with:
          name: published-coupled-filter-v01-${{ matrix.start }}
          path: published-coupled-filter-v01-*.json
