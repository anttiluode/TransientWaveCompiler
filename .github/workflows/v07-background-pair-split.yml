name: v07-background-pair-split

on:
  push:
    branches:
      - agent/tw1a-active-summing-v07
    paths:
      - 'experiments/v07_background_pair_split.py'
      - 'docs/CIRCUIT_V07_BACKGROUND_PAIR_PREREG.md'
      - '.github/workflows/v07-background-pair-split.yml'
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run controlled background pair split
        run: python experiments/v07_background_pair_split.py
      - name: Upload background pair split
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v07-background-pair-split
          path: v07-background-pair-split.json
