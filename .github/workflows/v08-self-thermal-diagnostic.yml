name: v08-self-thermal-diagnostic

on:
  push:
    branches:
      - agent/tw1a-common-diff-v08
    paths:
      - 'transientwave/circuit_emulator_v08_self_thermal.py'
      - 'experiments/v08_self_thermal_diagnostic.py'
      - 'docs/CIRCUIT_V08_SELF_THERMAL_DIAGNOSTIC_PREREG.md'
      - '.github/workflows/v08-self-thermal-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run frozen v0.8 self-sampling thermal diagnostic
        run: python experiments/v08_self_thermal_diagnostic.py
      - name: Upload self thermal diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v08-self-thermal-diagnostic
          path: v08-self-thermal-diagnostic.json
