name: v09-fixed-theta-gradient-snr

on:
  push:
    branches:
      - agent/tw1a-common-diff-v08
    paths:
      - 'transientwave/circuit_emulator_v09_partitioned_rng.py'
      - 'experiments/v09_fixed_theta_gradient_snr.py'
      - 'docs/BENCHMARK_V09_FIXED_THETA_GRADIENT_SNR_PREREG.md'
      - 'tests/test_v09_partitioned_rng.py'
      - '.github/workflows/v09-fixed-theta-gradient-snr.yml'
  workflow_dispatch:

jobs:
  snr:
    strategy:
      fail-fast: false
      matrix:
        dynamic_seed: [8000, 8001, 8002, 8003, 8004]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Verify partitioned RNG invariants
        run: python -m unittest tests.test_v09_partitioned_rng -v
      - name: Measure fixed-theta gradient convergence
        run: python experiments/v09_fixed_theta_gradient_snr.py --dynamic-seed ${{ matrix.dynamic_seed }}
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: v09-fixed-theta-gradient-snr-${{ matrix.dynamic_seed }}
          path: v09-fixed-theta-gradient-snr-*.json
