name: v09-fresh-corner

on:
  push:
    branches:
      - agent/tw1a-common-diff-v08
    paths:
      - 'experiments/v09_fresh_corner.py'
      - 'docs/CIRCUIT_V09_FRESH_PREREG.md'
      - '.github/workflows/v09-fresh-corner.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run preregistered fresh v0.9 qualification
        run: python experiments/v09_fresh_corner.py
      - name: Upload fresh v0.9 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v09-fresh-corner
          path: v09-fresh-corner.json
