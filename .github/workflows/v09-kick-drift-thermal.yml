name: v09-kick-drift-thermal

on:
  push:
    branches:
      - agent/tw1a-common-diff-v08
    paths:
      - 'transientwave/circuit_emulator_v09_kick_drift.py'
      - 'experiments/v09_kick_drift_thermal_sweep.py'
      - 'docs/CIRCUIT_V09_KICK_DRIFT_THERMAL_PREREG.md'
      - '.github/workflows/v09-kick-drift-thermal.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run preregistered full kick-drift thermal sweep
        run: python experiments/v09_kick_drift_thermal_sweep.py
      - name: Upload kick-drift thermal result
        uses: actions/upload-artifact@v4
        with:
          name: v09-kick-drift-thermal
          path: v09-kick-drift-thermal-sweep.json
