name: v09-seed2400-switch-interaction

on:
  push:
    branches:
      - agent/tw1a-common-diff-v08
    paths:
      - 'experiments/v09_seed2400_switch_interaction.py'
      - 'docs/CIRCUIT_V09_SEED2400_SWITCH_INTERACTION_PREREG.md'
      - '.github/workflows/v09-seed2400-switch-interaction.yml'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run seed 2400 switch interaction sweep
        run: python experiments/v09_seed2400_switch_interaction.py
      - name: Upload switch interaction result
        uses: actions/upload-artifact@v4
        with:
          name: v09-seed2400-switch-interaction
          path: v09-seed2400-switch-interaction.json
