[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transientwavecompiler"
version = "0.1.0"
description = "Compiler for finite-time damped reciprocal wave programs targeting an echo-trainable physical mesh"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
twc = "transientwave.cli:main"
twc-tw1a = "transientwave.hw_cli:main"
twc-hw = "transientwave.hardware_report_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["transientwave*"]